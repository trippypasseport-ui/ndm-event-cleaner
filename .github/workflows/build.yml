name: Build AU Plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-au:
    runs-on: macos-14

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier que le cœur DSP compile (Apple clang, cible 10.13)
        run: |
          clang++ -std=c++17 -O2 -mmacosx-version-min=10.13 -Wall -Wextra -o /tmp/parity_test tests/parity_test.cpp
          clang++ -std=c++17 -O2 -mmacosx-version-min=10.13 -Wall -Wextra -o /tmp/render_test tests/render_test.cpp

      - name: Configurer (Intel x86_64, compatible macOS 10.13+)
        run: |
          cmake -B build -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Compiler
        run: cmake --build build --config Release

      - name: Localiser le .component compilé (pour vérification dans les logs)
        run: find build -name "*.component"

      - name: Publier le plugin compilé en téléchargement
        uses: actions/upload-artifact@v4
        with:
          name: NdmEventCleaner-AU
          path: build/**/*.component
          if-no-files-found: error
